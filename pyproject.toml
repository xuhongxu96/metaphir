[project]
name = "metaphir"
version = "0.1.0"
description = "A measurement-first metaprogramming layer for LLVM IR, specialized to the InstCombine peephole optimizer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["eval/scripts", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PL", "EXE"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[dependency-groups]
dev = [
    "clang-format>=23.1.1",
]
